name: Restore and integrate manual links

on:
  push:
    branches: [main]
    paths:
      - scripts/integrate_manual_links.py
      - .github/workflows/restore-and-integrate-manual.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known-good builder
        run: git show b29f5faa2c2f86143fdca7a262814d1adedd02eb:index.html > index.html
      - name: Integrate manual links
        run: python scripts/integrate_manual_links.py
      - name: Syntax check embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('</script><script>')+len('</script><script>')
          b=s.index('</script>',a)
          Path('/tmp/check.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit repaired builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v0.13.3: integrate official manual page links" || exit 0
          git push
