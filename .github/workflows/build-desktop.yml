name: Build desktop page

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/make_desktop_v2.py
      - .github/workflows/build-desktop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate desktop.html
        run: python scripts/make_desktop_v2.py
      - name: Commit desktop page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html
          if git diff --cached --quiet; then
            echo "desktop.html already up to date"
          else
            git commit -m "Build desktop browser layout"
            git push
          fi
