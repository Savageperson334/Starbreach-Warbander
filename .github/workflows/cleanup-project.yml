name: Consolidate Star Breach project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-project.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consolidate active runtime
        shell: bash
        run: |
          set -euo pipefail

          cp v0132-fix.css starbreach-ui.css
          cat v0132-fix.js v0136-roster-add.js v0137-breach-guide.js v0138-breach-guide-bottom.js > starbreach-ui.js
          cat >> starbreach-ui.js <<'JS'

          // Keep the displayed release label aligned with the consolidated runtime.
          (() => {
            document.title = document.title.replace(/v0\.13\.\d+/g, 'v0.13.8');
            document.querySelectorAll('small').forEach(el => {
              if (/v0\.13\.\d+/.test(el.textContent)) {
                el.textContent = el.textContent.replace(/v0\.13\.\d+/g, 'v0.13.8');
              }
            });
          })();
          JS

          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.html')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace('v0132-fix.css', 'starbreach-ui.css')
          app = app.replace('v0132-fix.js', 'starbreach-ui.js')
          app = app.replace('Star Breach Warband Builder — v0.13.3', 'Star Breach Warband Builder — v0.13.8')
          app = app.replace('unofficial prototype v0.13.3 • 1st Ed. errata PDF', 'unofficial prototype v0.13.8 • 1st Ed. errata PDF')
          app_path.write_text(app, encoding='utf-8')

          index = '''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>Star Breach Warband Builder</title>
            <style>
              html,body{margin:0;min-height:100%;background:#051014;color:#eefcfb;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
              body{display:grid;place-items:center;min-height:100vh}.loader{opacity:.75;text-align:center;padding:24px}
            </style>
          </head>
          <body>
            <div class="loader">Loading Star Breach Warband Builder…</div>
            <script>
              (async()=>{
                try{
                  const stamp=Date.now();
                  const r=await fetch(`app.html?fresh=${stamp}`,{cache:'no-store'});
                  if(!r.ok) throw new Error(`HTTP ${r.status}`);
                  let html=await r.text();
                  html=html
                    .replace('starbreach-ui.css"',`starbreach-ui.css?fresh=${stamp}"`)
                    .replace('starbreach-ui.js"',`starbreach-ui.js?fresh=${stamp}"`);
                  document.open();
                  document.write(html);
                  document.close();
                }catch(err){
                  document.body.innerHTML='<div class="loader"><b>Could not load the builder.</b><br>Please try again in a moment.</div>';
                  console.error(err);
                }
              })();
            </script>
          </body>
          </html>
          '''
          Path('index.html').write_text(index, encoding='utf-8')
          PY

          rm -f \
            v0132-fix.css \
            v0132-fix.js \
            v0134-layout.css \
            v0134-layout.js \
            v0136-roster-add.js \
            v0137-breach-guide.js \
            v0138-breach-guide-bottom.js

      - name: Add documentation and local smoke check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts

          cat > README.md <<'MD'
          # Star Breach Warband Builder

          Mobile-first, unofficial warband builder and BREACH play-reference companion for **Star Breach 1st Edition**.

          The builder is based on the freely available 1st Edition errata rules PDF and links back to the official hosted manual for rule references. It is not an official Star Breach product.

          ## Modes

          **BUILD** constructs and validates a warband: UC totals, specialist limits, faction/profile restrictions, equipment, Alpha Skills, psychic abilities, faction-specific rules, save/load, and JSON import/export.

          **BREACH** is the table-side reference view: completed roster, equipped weapon profiles, skills, psychic abilities, special rules, notes, base guidance, and a scenario-agnostic turn walkthrough.

          ## Structure

          - `index.html` — tiny cache-busting GitHub Pages loader.
          - `app.html` — core builder, embedded rules/reference data, BUILD UI, and BREACH renderer.
          - `starbreach-ui.css` — current UI/theme extension styling.
          - `starbreach-ui.js` — current UI enhancements and BREACH turn guide.
          - `scripts/smoke_test.py` — lightweight structural and JavaScript syntax checks.

          The public site intentionally has one responsive/mobile-first interface. There is no separate desktop version.

          ## Development rule

          Keep `app.html` as the core application and use the stable `starbreach-ui.css` / `starbreach-ui.js` extension points for UI refinements. Avoid creating another versioned patch file for every small change.
          MD

          cat > scripts/smoke_test.py <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          ROOT = Path(__file__).resolve().parents[1]
          index = (ROOT / 'index.html').read_text(encoding='utf-8')
          app = (ROOT / 'app.html').read_text(encoding='utf-8')
          ui_js = ROOT / 'starbreach-ui.js'
          ui_css = ROOT / 'starbreach-ui.css'

          def require(condition, message):
              if not condition:
                  raise SystemExit(f'SMOKE TEST FAILED: {message}')

          require('__FROM_LOCAL_FILE_NOT_SUPPORTED__' not in index + app, 'placeholder text found')
          require('fetch(`app.html?fresh=${stamp}`' in index, 'cache-busting loader missing')
          require('starbreach-ui.css' in app and 'starbreach-ui.js' in app, 'stable UI assets missing from app')
          require('starbreach-ui.css?fresh=${stamp}' in index, 'CSS cache busting missing')
          require('starbreach-ui.js?fresh=${stamp}' in index, 'JS cache busting missing')
          require(ui_js.exists() and ui_css.exists(), 'consolidated UI files missing')
          require('id="faction"' in app, 'Faction selector missing')
          require('id="roster"' in app, 'Roster container missing')
          require('id="breachView"' in app and 'id="breachContent"' in app, 'BREACH containers missing')
          for old in ('v0132-fix', 'v0136-roster-add', 'v0137-breach-guide', 'v0138-breach-guide-bottom'):
              require(old not in index + app, f'legacy runtime reference remains: {old}')

          subprocess.run(['node', '--check', str(ui_js)], check=True)
          start = index.index('<script>') + len('<script>')
          end = index.index('</script>', start)
          with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as fh:
              fh.write(index[start:end])
              loader_js = fh.name
          subprocess.run(['node', '--check', loader_js], check=True)
          print('Star Breach smoke checks passed.')
          PY

      - name: Verify consolidated build
        run: python scripts/smoke_test.py

      - name: Commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'Consolidate builder runtime and remove legacy patch chain'
          git push
