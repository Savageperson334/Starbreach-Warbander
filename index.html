<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Star Breach Warband Builder</title>
  <style>
    html,body{margin:0;min-height:100%;background:#051014;color:#eefcfb;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{display:grid;place-items:center;min-height:100vh}.loader{opacity:.75;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div class="loader">Loading Star Breach Warband Builder…</div>
  <script>
    (async()=>{
      try{
        const stamp=Date.now();
        const r=await fetch(`app.html?fresh=${stamp}`,{cache:'no-store'});
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        let html=await r.text();
        html=html
          .replace('v0132-fix.css"',`v0132-fix.css?fresh=${stamp}"`)
          .replace('v0132-fix.js"',`v0132-fix.js?fresh=${stamp}"`);
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML='<div class="loader"><b>Could not load the builder.</b><br>Please try again in a moment.</div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
