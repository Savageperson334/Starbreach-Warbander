<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Star Breach Warband Builder — Desktop</title>
<style>
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b10}
#desktopApp{display:block;width:100%;height:100%;border:0;background:#050b10}
</style>
</head>
<body>
<iframe id="desktopApp" title="Star Breach Warband Builder desktop layout"></iframe>
<script>
(() => {
  const frame = document.getElementById('desktopApp');
  frame.src = `index.html?desktop=${Date.now()}`;
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.documentElement.dataset.desktopEnhanced === '1') return;
    doc.documentElement.dataset.desktopEnhanced = '1';

    const main = doc.querySelector('main');
    const sidebar = doc.querySelector('main > .sidebar');
    const warband = doc.getElementById('warbandSettings');
    const reference = doc.getElementById('factionReferencePanel') || doc.querySelector('.reference-panel');
    const roster = doc.querySelector('main > .roster-panel');
    const dockAdd = doc.getElementById('dockAddModel');
    if (!main || !sidebar || !warband || !reference || !roster) return;

    const left = doc.createElement('aside');
    left.className = 'desktop-rail desktop-left';
    const right = doc.createElement('aside');
    right.className = 'desktop-rail desktop-right';
    left.append(warband);
    right.append(reference);
    sidebar.remove();
    main.classList.add('desktop-main');
    main.prepend(left);
    main.append(right);

    const style = doc.createElement('style');
    style.textContent = `
      html{box-sizing:border-box;max-width:100%;overflow-x:hidden}
      *,*::before,*::after{box-sizing:inherit}
      body{max-width:100%;overflow-x:hidden}
      @media screen and (min-width:1100px){
        body{font-size:15px}
        .top-shell{z-index:80}
        .brand-row,.dock-main,.dock-extra,.dock-add-head,.dock-add-body{width:100%;max-width:1880px;margin-left:auto;margin-right:auto;box-sizing:border-box}
        main.desktop-main{width:100%;max-width:1880px;box-sizing:border-box;margin:0 auto;padding:16px 18px 36px;display:grid!important;grid-template-columns:minmax(280px,340px) minmax(0,1fr) minmax(300px,380px);gap:16px;align-items:start;overflow:visible}
        .desktop-rail{display:grid;gap:14px;align-content:start;min-width:0;width:100%;position:sticky;top:178px;max-height:calc(100vh - 192px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 2px 8px;scrollbar-width:thin}
        .desktop-left{grid-column:1}.roster-panel{grid-column:2;min-width:0}.desktop-right{grid-column:3}
        .desktop-rail>.panel,.desktop-rail .panel{width:100%;max-width:100%;min-width:0;box-sizing:border-box;box-shadow:0 7px 18px #0006}
        .desktop-rail .panel.pad{padding:14px}.desktop-rail .stack{gap:10px}
        .desktop-left #toggleThemePanel{max-width:100%;white-space:normal;line-height:1.1;text-align:center}
        .desktop-right .reference-panel{min-height:0}.desktop-right .faction-ref{max-height:none}
        .roster-panel{width:100%;max-width:100%;padding:16px!important;box-sizing:border-box;box-shadow:0 12px 28px #0008}
        .roster{gap:10px}.unitbody{padding:12px;gap:11px}.unithead{padding:10px 12px}.unithead h3{font-size:17px}.unit-mini{max-width:520px}
        .loadout-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.slot{padding:9px;gap:6px}.rule-summary{gap:6px}.rule-line{padding:7px 8px}
        .stats{gap:6px}.stat{padding:7px}.stat b{font-size:18px}
        .theme-panel{padding:10px;gap:9px}.theme-slider{grid-template-columns:92px minmax(0,1fr) 42px;gap:8px}.theme-preview{height:44px}
        #specialRules{font-size:12px}.rule-card{padding:9px}.rule-text{font-size:12px;line-height:1.48}.rule-name{font-size:13px}
        .dock-add-model{padding-left:18px;padding-right:18px}
        .dock-add-body{grid-template-columns:minmax(260px,320px) minmax(0,1fr) auto}
      }
      @media screen and (min-width:1500px){
        main.desktop-main{grid-template-columns:minmax(320px,350px) minmax(0,1fr) minmax(350px,400px);gap:18px}
        .loadout-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
        .unit-mini{max-width:720px}
      }
      @media screen and (max-width:1099px){
        main.desktop-main{width:100%;max-width:1380px;box-sizing:border-box;margin:auto;padding:20px;display:grid!important;grid-template-columns:minmax(0,1fr);gap:16px}
        .desktop-rail{display:grid;gap:16px;position:static;max-height:none;overflow:visible;width:100%;min-width:0}
        .desktop-left{order:1}.roster-panel{order:2}.desktop-right{order:3}
      }
    `;
    doc.head.appendChild(style);

    const brand = doc.querySelector('.brand-row');
    if (brand && !doc.getElementById('desktopResponsiveLink')) {
      const link = doc.createElement('a');
      link.id = 'desktopResponsiveLink';
      link.href = 'index.html';
      link.target = '_top';
      link.textContent = 'Responsive view';
      link.style.cssText = 'border:1px solid #587096;background:#10223a;color:#d9e8f5;text-decoration:none;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:750;white-space:nowrap';
      brand.appendChild(link);
    }

    if (dockAdd) dockAdd.dataset.desktopDocked = '1';
  });
})();
</script>
</body>
</html>
